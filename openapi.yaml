openapi: 3.0.3
info:
  title: Financial Planning API
  version: 1.1.0
  description: >
    REST API for the Financial Planning backend (Go/Gin).
    All `/api/auth/v1/…` routes require a valid JWT supplied either as an
    `accessToken` cookie or a `Bearer` token in the `Authorization` header.

servers:
  - url: http://localhost:8080
    description: Local dev

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Common ────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: "not found"

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: "success"

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
      example:
        email: "user@example.com"
        password: "secret123"
        name: "John Doe"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: "user@example.com"
        password: "secret123"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
          description: HTTP status as a string (always "200")
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT used in subsequent requests
      example:
        message: "Login Successfully"
        status: "200"
        data:
          token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    # ── Transactions ──────────────────────────────────────────────────────────
    TransactionRequest:
      type: object
      required: [amount, category, type, date]
      properties:
        amount:
          type: integer
          description: Amount in smallest currency unit (e.g. IDR — no decimal)
        category:
          type: string
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: Case-insensitive; normalised to uppercase server-side
        date:
          type: string
          format: date-time
        description:
          type: string
      example:
        amount: 500000
        category: "Food"
        type: "EXPENSE"
        date: "2025-05-01T00:00:00Z"
        description: "Lunch"

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          format: float
        category:
          type: string
        type:
          type: string
          enum: [INCOME, EXPENSE]
        date:
          type: string
          format: date-time
        description:
          type: string

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        total:
          type: integer
          description: >
            Total number of matching records (not pages).
            Calculate pages client-side: ceil(total / limit).
      example:
        data: []
        total: 0

    MonthlyTotalResponse:
      type: object
      properties:
        total:
          type: number
          format: float
          description: Aggregated amount for the current calendar month
        message:
          type: string
      example:
        total: 3000000
        message: "success"

    # ── Budgets ───────────────────────────────────────────────────────────────
    CreateBudgetRequest:
      type: object
      required: [category, period, year, limit_amount]
      properties:
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
          description: 1–12. Required when period is MONTHLY; omit for YEARLY.
        year:
          type: integer
        limit_amount:
          type: integer
        alert_threshold:
          type: integer
          default: 80
          description: Percentage (0–100) at which WARNING status is triggered
      example:
        category: "Food"
        period: "MONTHLY"
        month: 5
        year: 2025
        limit_amount: 2000000
        alert_threshold: 80

    UpdateBudgetRequest:
      type: object
      description: All fields are optional; send only what should change.
      properties:
        limitAmount:
          type: integer
          description: New limit. Zero means "keep existing".
        alertThreshold:
          type: integer
          description: New threshold percentage. Zero means "keep existing".
        category:
          type: string
          description: Rename the category. Empty string means "keep existing".
      example:
        limitAmount: 2500000
        alertThreshold: 75

    # GetAll /budgets returns Budget (snake_case)
    BudgetListItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
        year:
          type: integer
        limit_amount:
          type: integer
        alert_threshold:
          type: integer
        created_at:
          type: string
          format: date-time

    # GetByID /budgets/:id returns BudgetResponse (camelCase)
    BudgetResponse:
      type: object
      description: >
        Note: field names use camelCase here (returned by GET /budgets/:id only).
        The list endpoint GET /budgets returns snake_case fields instead.
      properties:
        id:
          type: integer
        userId:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
        year:
          type: integer
        limitAmount:
          type: integer
        alertThreshold:
          type: integer
        createdAt:
          type: string
          format: date-time

    # PUT /budgets/:id returns UpdateBudgetResponse (snake_case, no created_at)
    UpdateBudgetResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
        year:
          type: integer
        limit_amount:
          type: integer
        alert_threshold:
          type: integer

    BudgetUsageResponse:
      type: object
      properties:
        budget_id:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        limit:
          type: integer
        alert_threshold:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        percentage:
          type: number
          format: float
          description: Current spend as % of limit
        status:
          type: string
          enum: [SAFE, WARNING, EXCEEDED]
        change_percent:
          type: number
          format: float
          description: Spend change vs. same period last month (%)

    # ── Goals ─────────────────────────────────────────────────────────────────
    CreateGoalRequest:
      type: object
      required: [name, target_amount, deadline]
      properties:
        name:
          type: string
        target_amount:
          type: integer
        description:
          type: string
        deadline:
          type: string
          format: date-time
          description: Must be in the future
      example:
        name: "Emergency Fund"
        target_amount: 10000000
        description: "3 months of expenses"
        deadline: "2025-12-31T00:00:00Z"

    GoalResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        target_amount:
          type: integer
        current_amount:
          type: integer
        status:
          type: string
          enum: [ONGOING, COMPLETED]
        deadline:
          type: string
          format: date-time
        description:
          type: string
        created_at:
          type: string
          format: date-time

    GoalOverviewResponse:
      type: object
      properties:
        total_goals:
          type: integer
          description: Count of active goals (deadline >= now)
        savings:
          type: integer
          description: Sum of current_amount across all goals
        goals:
          type: array
          description: Next 4 upcoming milestones ordered by deadline
          items:
            $ref: '#/components/schemas/GoalResponse'

    GoalContributionRequest:
      type: object
      required: [goal_id, contribution]
      properties:
        goal_id:
          type: integer
        contribution:
          type: integer
          description: >
            Sets current_amount directly (not an increment).
            Must be > 0 and <= all-time net savings.
      example:
        goal_id: 1
        contribution: 500000

    # ── Dashboard ─────────────────────────────────────────────────────────────
    BudgetStatusSummary:
      type: object
      properties:
        total:
          type: integer
        safe:
          type: integer
        warning:
          type: integer
        exceeded:
          type: integer

    GoalProgressSummary:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        completed:
          type: integer

    DashboardResponse:
      type: object
      properties:
        monthly_income:
          type: number
          format: float
          description: Total INCOME transactions for the current calendar month
        monthly_expense:
          type: number
          format: float
          description: Total EXPENSE transactions for the current calendar month
        net_savings:
          type: number
          format: float
          description: All-time net savings (total INCOME − total EXPENSE)
        budget_summary:
          $ref: '#/components/schemas/BudgetStatusSummary'
        goal_summary:
          $ref: '#/components/schemas/GoalProgressSummary'
        active_goals:
          type: array
          description: Goals with deadline >= now
          items:
            $ref: '#/components/schemas/GoalResponse'
      example:
        monthly_income: 5000000
        monthly_expense: 3200000
        net_savings: 18500000
        budget_summary:
          total: 3
          safe: 2
          warning: 1
          exceeded: 0
        goal_summary:
          total: 2
          active: 1
          completed: 1
        active_goals: []

    # ── Chat ──────────────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Natural-language question about the user's finances
      example:
        message: "Berapa pengeluaran saya bulan ini?"

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          description: AI-generated answer in the same language as the question
      example:
        reply: "Pengeluaran Anda bulan ini adalah Rp 3.200.000."

paths:
  # ── Auth ────────────────────────────────────────────────────────────────────
  /api/v1/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      description: >
        On success the JWT is returned in the response body **and** set as an
        `accessToken` cookie (1-hour expiry). Subsequent requests may use
        either the cookie or an `Authorization: Bearer <token>` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users:
    get:
      tags: [Auth]
      summary: List all users (no auth required)
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  status:
                    type: string
                  message:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Transactions ─────────────────────────────────────────────────────────────
  /api/auth/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions (paginated, filterable)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Filter by month number (1–12)"
        - name: year
          in: query
          schema:
            type: string
          description: "Filter by 4-digit year"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Page size (0 = no limit)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of records to skip
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Transactions]
      summary: Create a transaction
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/transactions/monthly:
    get:
      tags: [Transactions]
      summary: Current month total expenses
      description: Returns the sum of all EXPENSE transactions for the current calendar month.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Monthly expense total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTotalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/transactions/monthly-income:
    get:
      tags: [Transactions]
      summary: Current month total income
      description: Returns the sum of all INCOME transactions for the current calendar month.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Monthly income total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTotalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/transactions/{id}:
    put:
      tags: [Transactions]
      summary: Update a transaction
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid input or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Transactions]
      summary: Soft-delete a transaction
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Budgets ───────────────────────────────────────────────────────────────────
  /api/auth/v1/budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      description: >
        Response fields use **snake_case** (`user_id`, `limit_amount`,
        `alert_threshold`, `created_at`). See `BudgetListItem` schema.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: month
          in: query
          schema:
            type: string
          description: Filter by month number
        - name: year
          in: query
          schema:
            type: string
          description: Filter by 4-digit year
      responses:
        '200':
          description: Budget list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BudgetListItem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Budgets]
      summary: Create a budget
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Budget for this category/period/month/year already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/budgets/usage:
    get:
      tags: [Budgets]
      summary: Budget usage with SAFE / WARNING / EXCEEDED status
      description: >
        Compares current-period spending against limit_amount and
        alert_threshold. Returns a **direct JSON array** (not wrapped in
        `{"data": ...}`).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
          description: 4-digit year (e.g. 2025)
        - name: month
          in: query
          schema:
            type: integer
          description: 1–12. Defaults to current month when omitted.
      responses:
        '200':
          description: Budget usage array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetUsageResponse'
        '400':
          description: Invalid or missing year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/budgets/{id}:
    get:
      tags: [Budgets]
      summary: Get budget by ID
      description: >
        Response fields use **camelCase** (`userId`, `limitAmount`,
        `alertThreshold`, `createdAt`). See `BudgetResponse` schema.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Budget detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BudgetResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Budgets]
      summary: Update a budget
      description: >
        Partial update — omitted fields keep their existing values.
        Zero values for `limitAmount` / `alertThreshold` are treated as
        "no change" (see `NULLIF` in repo). Response uses **snake_case**
        and does not include `created_at`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
      responses:
        '200':
          description: Budget updated — returns updated record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UpdateBudgetResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Budgets]
      summary: Soft-delete a budget
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Budget deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Goals ──────────────────────────────────────────────────────────────────────
  /api/auth/v1/goals:
    get:
      tags: [Goals]
      summary: List goals
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
            default: false
          description: >
            Pass `true` to return only goals whose deadline >= now.
            Server compares the string value "true" literally.
      responses:
        '200':
          description: Goal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GoalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Goals]
      summary: Create a goal
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error (deadline in past, target ≤ 0, name empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Active goal with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/overview:
    get:
      tags: [Goals]
      summary: Goal overview — active count, total savings, upcoming milestones
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Goal overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/GoalOverviewResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/milestones:
    get:
      tags: [Goals]
      summary: Next 4 upcoming milestones (deadline ascending, not yet completed)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Milestone list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 4
                    items:
                      $ref: '#/components/schemas/GoalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/contribute:
    patch:
      tags: [Goals]
      summary: Set a goal's current_amount
      description: >
        **Sets** `current_amount` to the supplied `contribution` value — it does
        not add to the existing amount. Auto-completes the goal when
        `contribution >= target_amount`. Contribution must not exceed
        all-time net savings.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalContributionRequest'
      responses:
        '200':
          description: Contribution applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid input or contribution exceeds net savings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/{id}:
    get:
      tags: [Goals]
      summary: Get goal by ID
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Goal detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Goals]
      summary: Update a goal
      description: >
        If new `target_amount` is less than `current_amount`, the target
        is NOT updated (prevents setting a target below what was already saved).
        Deadline is updated unconditionally.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Goals]
      summary: Hard-delete a goal
      description: >
        Unlike transactions and budgets, goals are permanently deleted
        (no soft-delete / `deleted_at`).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Goal deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /api/auth/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregated financial dashboard
      description: >
        Returns current-month income, expense, all-time net savings, budget
        status counts, goal progress counts, and list of active goals.
        No query parameters — always uses server-side `time.Now()`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Chat ──────────────────────────────────────────────────────────────────────
  /api/auth/v1/chat:
    post:
      tags: [Chat]
      summary: Ask the AI assistant about your finances
      description: >
        Sends a natural-language question to Gemini 2.0 Flash with the user's
        current financial context (monthly income/expense, budget status, active
        goals). The conversation is persisted to `ai_logs`. Responds in the
        same language the user writes in. Requires `GEMINI_API_KEY` to be set
        on the server — returns 503 otherwise.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: AI reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Missing or empty message field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Gemini API key not configured or Gemini unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
