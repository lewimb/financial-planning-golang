      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
          description: 4-digit year. Defaults to current year.
      responses:
        '200':
          description: 12-month savings rate array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsRateHistoryResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Error' }

  /api/auth/v1/reports/month-comparison-v2:
    get:
      tags: [Reports]
      summary: "Month-over-month comparison with savings delta (frontend format)"
      description: >
        Compares the requested month against the prior month. Unlike
        `/reports/month-comparison`, this endpoint accepts explicit `month` and
        `year` parameters and includes a `savings` field and `savings_pct` in
        `changes`. Defaults to current month/year.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Month number (1–12). Defaults to current month.
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
          description: 4-digit year. Defaults to current year.
      responses:
        '200':
          description: Month-over-month comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthComparisonV2Response'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Error' }

  /api/auth/v1/transactions/category-breakdown:
    get:
      tags: [Transactions]
      summary: "Expense breakdown by category with totals and labels (pie chart)"
      description: >
        Returns per-category expense aggregation for the given month/year.
        Includes human-readable `label`, absolute `total`, `percentage`, and
        `transaction_count`. Sorted by total descending.
        Use this instead of `/reports/category-breakdown` for chart components.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Month number. Defaults to current month.
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
          description: 4-digit year. Defaults to current year.
      responses:
        '200':
          description: Category breakdown with totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryBreakdownResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Error' }

  # ── AI Coach / Insights ───────────────────────────────────────────────────

  /api/auth/v1/financial-health:
    get:
      tags: [AI Coach]
      summary: Calculate personalized financial health score
      description: >
        Returns a rule-based financial health score (0–100) derived from the
        authenticated user's current month transactions, budget usage, and goal
        progress. Responds 200 even when the user has no data (defaults to
        neutral/full scores).

        **Scoring formula:**
        - savings_score = min(savings_rate / 0.20 * 40, 40) — full 40 pts at 20% savings rate
        - budget_score = budget_adherence * 30
        - goal_score = goal_progress * 30
        - total = round(sum)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Financial health score and breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialHealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Error' }

  /api/auth/v1/insights:
    get:
      tags: [AI Coach]
      summary: Personalized financial insights (rule-based)
      description: >
        Generates up to 5 insights from the user's goals, budget usage, and
        recent transaction trends. Returns a `no_data` insight when there is
        insufficient data.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Month to evaluate. Defaults to current month.
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
          description: Year to evaluate. Defaults to current year.
      responses:
        '200':
          description: List of personalized insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Error' }

  /api/auth/v1/recommendations:
    get:
      tags: [AI Coach]
      summary: Personalized financial recommendations (rule-based)
      description: >
        Returns up to 4 ranked recommendations derived from the user's savings
        rate, budget usage, and upcoming goal deadlines. Rules:

        1. savings_rate < 10% → recommend increasing to 20%
        2. Any budget ≥ 90% used → recommend reviewing that category
        3. Goal deadline < 60 days + progress < 80% → recommend boosting contributions
        4. No matches → returns a "keep up the good work" placeholder
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: List of recommendations sorted by priority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Error' }
