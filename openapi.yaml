        - ML
      summary: Spending analysis
      description: >
        Fetches the authenticated user's transactions, forwards them to the ML
        service (`POST /analysis`), and returns aggregated spending statistics.
        Filters by `year` and/or `month` when provided.
        Backed by Facebook Prophet / Pandas. Timeout: 5 s.
        Returns 503 when the ML service is unreachable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: string
            example: "2026"
          description: Filter transactions to this year (YYYY)
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "01"
          description: Filter transactions to this month (MM); requires year
      responses:
        '200':
          description: Aggregated spending statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLAnalysisResponse'
        '503':
          description: ML service unreachable or returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/ml/anomaly:
    get:
      tags:
        - ML
      summary: Anomaly detection
      description: >
        Fetches the authenticated user's transactions, forwards them to the ML
        service (`POST /anomaly`), and returns days with statistically unusual
        spending. Uses IsolationForest (scikit-learn). Requires at least 5 unique
        expense days — returns an empty anomaly list otherwise.
        Filters by `year` and/or `month` when provided. Timeout: 10 s.
        Returns 503 when the ML service is unreachable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: string
            example: "2026"
          description: Filter transactions to this year (YYYY)
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "01"
          description: Filter transactions to this month (MM); requires year
      responses:
        '200':
          description: Anomalous spending days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLAnomalyResponse'
        '503':
          description: ML service unreachable or returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/ml/forecast:
    get:
      tags:
        - ML
      summary: Spending forecast
      description: >
        Fetches the authenticated user's transactions, forwards them to the ML
        service (`POST /forecast?periods=N`), and returns a day-by-day spending
        forecast. Uses Facebook Prophet. `periods` is clamped to [1, 365] and
        defaults to 30. Accuracy improves significantly with 30+ days of history.
        Filters by `year` and/or `month` when provided. Timeout: 60 s.
        Returns 503 when the ML service is unreachable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: periods
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          description: Number of days ahead to forecast
        - name: year
          in: query
          required: false
          schema:
            type: string
            example: "2026"
          description: Filter transactions to this year (YYYY)
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "01"
          description: Filter transactions to this month (MM); requires year
      responses:
        '200':
          description: Daily spending forecast and projected monthly total
          content:
