  # ── Financial Profile ──────────────────────────────────────────────────────────
  /api/auth/v1/financial-profile:
    post:
      tags: [Financial Profile]
      summary: Create or update financial profile
      description: >
        Upserts the authenticated user's financial profile. Creates on first call,
        updates on subsequent calls. Goals list is fully replaced on every call —
        send the complete desired list each time.
        Returns the saved profile including the computed `net_available` field
        (monthly_income − fixed_expenses − debt).
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialProfileRequest'
            example:
              monthly_income: 8000000
              fixed_expenses: 3000000
              current_savings: 5000000
              debt: 1000000
              employment_status: "employed"
              financial_goals: ["emergency_fund", "house"]
              spending_habit: "moderate"
              risk_level: "medium"
      responses:
        '200':
          description: Profile saved — returns the full profile with net_available
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "profile saved"
                  data:
                    $ref: '#/components/schemas/FinancialProfileResponse'
              example:
                message: "profile saved"
                data:
                  monthly_income: 8000000
                  fixed_expenses: 3000000
                  current_savings: 5000000
                  debt: 1000000
                  employment_status: "employed"
                  financial_goals: ["emergency_fund", "house"]
                  spending_habit: "moderate"
                  risk_level: "medium"
                  net_available: 4000000
                  created_at: "2026-05-19T10:00:00Z"
                  updated_at: "2026-05-19T10:00:00Z"
        '400':
          description: >
            Validation failure — any of: negative number field, empty
            employment_status, empty financial_goals array, blank goal entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                negative_income:
                  value: { "error": "monthly_income must be >= 0" }
                empty_goals:
                  value: { "error": "financial_goals cannot be empty" }
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Financial Profile]
      summary: Get current user's financial profile
      description: >
        Returns the authenticated user's financial profile including all goals
        and the computed `net_available` field. Returns 404 if the user has
        not yet completed onboarding (profile not created).
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Financial profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FinancialProfileResponse'
              example:
                data:
                  monthly_income: 8000000
                  fixed_expenses: 3000000
                  current_savings: 5000000
                  debt: 1000000
                  employment_status: "employed"
                  financial_goals: ["emergency_fund", "house"]
                  spending_habit: "moderate"
                  risk_level: "medium"
                  net_available: 4000000
                  created_at: "2026-05-19T10:00:00Z"
                  updated_at: "2026-05-19T10:00:00Z"
        '404':
          description: Profile not found — user has not completed onboarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "profile not found"
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

