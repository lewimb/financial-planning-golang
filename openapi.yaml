openapi: 3.0.3
info:
  title: Financial Planning API
  version: 1.4.0
  description: >
    REST API for the Financial Planning backend (Go/Gin).
    All `/api/auth/v1/…` routes require a valid JWT supplied either as an
    `accessToken` cookie or a `Bearer` token in the `Authorization` header.

servers:
  - url: http://localhost:8080
    description: Local dev

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Common ────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: "not found"

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: "success"

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
      example:
        email: "user@example.com"
        password: "secret123"
        name: "John Doe"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: "user@example.com"
        password: "secret123"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
          description: HTTP status as a string (always "200")
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT used in subsequent requests
      example:
        message: "Login Successfully"
        status: "200"
        data:
          token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    # ── Transactions ──────────────────────────────────────────────────────────
    TransactionRequest:
      type: object
      required: [amount, category, type, date]
      properties:
        amount:
          type: integer
          description: Amount in smallest currency unit (e.g. IDR — no decimal)
        category:
          type: string
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: Case-insensitive; normalised to uppercase server-side
        date:
          type: string
          format: date-time
        description:
          type: string
        is_recurring:
          type: boolean
          default: false
          description: Mark this transaction as recurring
        recurrence_interval:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
          description: Required when is_recurring is true
      example:
        amount: 500000
        category: "Food"
        type: "EXPENSE"
        date: "2025-05-01T00:00:00Z"
        description: "Lunch"
        is_recurring: false

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          format: float
        category:
          type: string
        type:
          type: string
          enum: [INCOME, EXPENSE]
        date:
          type: string
          format: date-time
        description:
          type: string
        is_recurring:
          type: boolean
        recurrence_interval:
          type: string
          nullable: true

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        total:
          type: integer
          description: >
            Total number of matching records (not pages).
            Calculate pages client-side: ceil(total / limit).
      example:
        data: []
        total: 0

    MonthlyTotalResponse:
      type: object
      properties:
        total:
          type: number
          format: float
          description: Aggregated amount for the current calendar month
        message:
          type: string
      example:
        total: 3000000
        message: "success"

    # ── Budgets ───────────────────────────────────────────────────────────────
    CreateBudgetRequest:
      type: object
      required: [category, period, limit_amount]
      properties:
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        year:
          type: integer
          nullable: true
          description: Required (and locked to the current year by the UI) when period is YEARLY. Ignored for MONTHLY — monthly budgets recur every month and store no month/year.
        limit_amount:
          type: integer
        alert_threshold:
          type: integer
          default: 80
          description: Percentage (0–100) at which WARNING status is triggered
      example:
        category: "Food"
        period: "MONTHLY"
        limit_amount: 2000000
        alert_threshold: 80

    UpdateBudgetRequest:
      type: object
      description: All fields are optional; send only what should change.
      properties:
        limitAmount:
          type: integer
          description: New limit. Zero means "keep existing".
        alertThreshold:
          type: integer
          description: New threshold percentage. Zero means "keep existing".
        category:
          type: string
          description: Rename the category. Empty string means "keep existing".
      example:
        limitAmount: 2500000
        alertThreshold: 75

    # GetAll /budgets returns Budget (snake_case)
    BudgetListItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
          description: Always null. Kept for backward compatibility with existing clients.
        year:
          type: integer
          nullable: true
          description: Null for MONTHLY (recurring); the specific calendar year for YEARLY.
        limit_amount:
          type: integer
        alert_threshold:
          type: integer
        created_at:
          type: string
          format: date-time

    # GetByID /budgets/:id returns BudgetResponse (camelCase)
    BudgetResponse:
      type: object
      description: >
        Note: field names use camelCase here (returned by GET /budgets/:id only).
        The list endpoint GET /budgets returns snake_case fields instead.
      properties:
        id:
          type: integer
        userId:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
          description: Always null. Kept for backward compatibility with existing clients.
        year:
          type: integer
          nullable: true
          description: Null for MONTHLY (recurring); the specific calendar year for YEARLY.
        limitAmount:
          type: integer
        alertThreshold:
          type: integer
        createdAt:
          type: string
          format: date-time

    # PUT /budgets/:id returns UpdateBudgetResponse (snake_case, no created_at)
    UpdateBudgetResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        month:
          type: integer
          nullable: true
          description: Always null. Kept for backward compatibility with existing clients.
        year:
          type: integer
          nullable: true
          description: Null for MONTHLY (recurring); the specific calendar year for YEARLY.
        limit_amount:
          type: integer
        alert_threshold:
          type: integer

    BudgetUsageResponse:
      type: object
      properties:
        budget_id:
          type: integer
        category:
          type: string
        period:
          type: string
          enum: [MONTHLY, YEARLY]
        limit:
          type: integer
        alert_threshold:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        percentage:
          type: number
          format: float
          description: Current spend as % of limit
        status:
          type: string
          enum: [SAFE, WARNING, EXCEEDED]
        change_percent:
          type: number
          format: float
          description: Spend change vs. same period last month (%)

    # ── Goals ─────────────────────────────────────────────────────────────────
    CreateGoalRequest:
      type: object
      required: [name, target_amount, deadline]
      properties:
        name:
          type: string
        target_amount:
          type: integer
        description:
          type: string
        deadline:
          type: string
          format: date-time
          description: Must be in the future
      example:
        name: "Emergency Fund"
        target_amount: 10000000
        description: "3 months of expenses"
        deadline: "2025-12-31T00:00:00Z"

    GoalResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        target_amount:
          type: integer
        current_amount:
          type: integer
        status:
          type: string
          enum: [ONGOING, COMPLETED]
        deadline:
          type: string
          format: date-time
        description:
          type: string
        created_at:
          type: string
          format: date-time

    GoalOverviewResponse:
      type: object
      properties:
        total_goals:
          type: integer
          description: Count of active goals (deadline >= now)
        savings:
          type: integer
          description: Sum of current_amount across all goals
        goals:
          type: array
          description: Next 4 upcoming milestones ordered by deadline
          items:
            $ref: '#/components/schemas/GoalResponse'
        completed_this_year:
          type: integer
          description: Number of goals completed in the current calendar year

    GoalContributionRequest:
      type: object
      required: [goal_id, contribution]
      properties:
        goal_id:
          type: integer
        contribution:
          type: integer
          description: >
            Sets current_amount directly (not an increment).
            Must be > 0 and <= all-time net savings.
      example:
        goal_id: 1
        contribution: 500000

    # ── Dashboard ─────────────────────────────────────────────────────────────
    BudgetStatusSummary:
      type: object
      properties:
        total:
          type: integer
        safe:
          type: integer
        warning:
          type: integer
        exceeded:
          type: integer

    GoalProgressSummary:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        completed:
          type: integer

    FinancialHealth:
      type: object
      properties:
        score:
          type: number
          format: float
          description: Overall financial health score 0–100
        savings_rate:
          type: number
          format: float
          description: Net savings as % of monthly income
        budget_adherence:
          type: number
          format: float
          description: Percentage of budgets with SAFE status
        goal_progress:
          type: number
          format: float
          description: Average goal completion percentage
        label:
          type: string
          enum: [Excellent, Good, Fair, Needs Attention]

    DashboardResponse:
      type: object
      properties:
        monthly_income:
          type: number
          format: float
          description: Total INCOME transactions for the current calendar month
        monthly_expense:
          type: number
          format: float
          description: Total EXPENSE transactions for the current calendar month
        net_savings:
          type: number
          format: float
          description: All-time net savings (total INCOME − total EXPENSE)
        budget_summary:
          $ref: '#/components/schemas/BudgetStatusSummary'
        goal_summary:
          $ref: '#/components/schemas/GoalProgressSummary'
        active_goals:
          type: array
          description: Goals with deadline >= now
          items:
            $ref: '#/components/schemas/GoalResponse'
        financial_health:
          $ref: '#/components/schemas/FinancialHealth'
        has_anomalies:
          type: boolean
          description: True if any budget is currently EXCEEDED
      example:
        monthly_income: 5000000
        monthly_expense: 3200000
        net_savings: 18500000
        budget_summary:
          total: 3
          safe: 2
          warning: 1
          exceeded: 0
        goal_summary:
          total: 2
          active: 1
          completed: 1
        active_goals: []

    # ── Chat ──────────────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Natural-language question about the user's finances
      example:
        message: "Berapa pengeluaran saya bulan ini?"

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          description: AI-generated answer in the same language as the question
      example:
        reply: "Pengeluaran Anda bulan ini adalah Rp 3.200.000."

    # ── Financial Profile ─────────────────────────────────────────────────────
    FinancialProfileRequest:
      type: object
      required:
        - monthly_income
        - fixed_expenses
        - current_savings
        - debt
        - employment_status
        - financial_goals
      properties:
        monthly_income:
          type: number
          format: double
          minimum: 0
          description: Gross monthly income
        fixed_expenses:
          type: number
          format: double
          minimum: 0
          description: Recurring monthly expenses (rent, subscriptions, etc.)
        current_savings:
          type: number
          format: double
          minimum: 0
          description: Total current savings balance
        debt:
          type: number
          format: double
          minimum: 0
          description: Total outstanding debt
        employment_status:
          type: string
          description: E.g. "employed", "self_employed", "student", "unemployed"
        financial_goals:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            One or more goal types the user is working toward.
            Common values: emergency_fund, house, investment, education, travel, retirement.
        spending_habit:
          type: string
          nullable: true
          description: "Optional. E.g. \"impulsive\", \"frugal\", \"moderate\""
        risk_level:
          type: string
          nullable: true
          description: "Optional. E.g. \"low\", \"medium\", \"high\""
      example:
        monthly_income: 8000000
        fixed_expenses: 3000000
        current_savings: 5000000
        debt: 1000000
        employment_status: "employed"
        financial_goals: ["emergency_fund", "house"]
        spending_habit: "moderate"
        risk_level: "medium"

    FinancialProfileResponse:
      type: object
      properties:
        monthly_income:
          type: number
          format: double
        fixed_expenses:
          type: number
          format: double
        current_savings:
          type: number
          format: double
        debt:
          type: number
          format: double
        employment_status:
          type: string
        financial_goals:
          type: array
          items:
            type: string
        spending_habit:
          type: string
          nullable: true
        risk_level:
          type: string
          nullable: true
        net_available:
          type: number
          format: double
          description: Computed as monthly_income − fixed_expenses − debt
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        monthly_income: 8000000
        fixed_expenses: 3000000
        current_savings: 5000000
        debt: 1000000
        employment_status: "employed"
        financial_goals: ["emergency_fund", "house"]
        spending_habit: "moderate"
        risk_level: "medium"
        net_available: 4000000
        created_at: "2026-05-19T10:00:00Z"
        updated_at: "2026-05-19T10:00:00Z"

    MLAnalysisResponse:
      type: object
      properties:
        total_expense:
          type: number
          format: double
          description: Sum of all EXPENSE transactions in the period
        avg_daily:
          type: number
          format: double
          description: Average daily spending
        top_category:
          type: string
          nullable: true
          description: Category with the highest total spend; null when no expense data
        spending_distribution:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Per-category spend totals
      example:
        total_expense: 450000
        avg_daily: 64285.71
        top_category: "food"
        spending_distribution:
          food: 180000
          transport: 150000
          utilities: 120000

    MLAnomalyRecord:
      type: object
      properties:
        date:
          type: string
          format: date
          description: YYYY-MM-DD of the anomalous spending day
        amount:
          type: number
          format: double
          description: Total spend on that day
        severity:
          type: string
          enum: [low, medium, high]
          description: >
            Z-score severity relative to all daily totals.
            low = 1–2σ, medium = 2–3σ, high = ≥3σ.
      example:
        date: "2026-01-15"
        amount: 875000
        severity: medium

    MLAnomalyResponse:
      type: object
      properties:
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/MLAnomalyRecord'
          description: Days flagged as statistically unusual. Empty if fewer than 5 expense days.
      example:
        anomalies:
          - date: "2026-01-15"
            amount: 875000
            severity: medium

    MLForecastRecord:
      type: object
      properties:
        date:
          type: string
          format: date
          description: YYYY-MM-DD of the predicted day
        predicted_amount:
          type: number
          format: double
          description: Predicted spend for that day
      example:
        date: "2026-02-01"
        predicted_amount: 58000

    MLForecastResponse:
      type: object
      properties:
        predicted_monthly_spending:
          type: number
          format: double
          description: Projected total spend for the forecast period
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: >
            Average forecast certainty (0–1). Computed from Prophet uncertainty intervals.
            0.0 when fewer than 2 data points exist.
        trend:
          type: string
          enum: [increasing, decreasing, stable]
          description: >
            Forecast direction. increasing = >5% growth, decreasing = >5% drop, stable otherwise.
        daily_forecast:
          type: array
          items:
            $ref: '#/components/schemas/MLForecastRecord'
          description: Day-by-day predicted spend
      example:
        predicted_monthly_spending: 1820000
        confidence: 0.82
        trend: stable
        daily_forecast:
          - date: "2026-02-01"
            predicted_amount: 58000
          - date: "2026-02-02"
            predicted_amount: 62000

    MLInsightsResponse:
      type: object
      properties:
        top_category:
          type: string
          nullable: true
          description: Category with highest total spending. Null if no data or all amounts zero.
        category_breakdown:
          type: object
          additionalProperties:
            type: number
            format: double
          description: >
            Percentage of total spending per category, rounded to 1 decimal place.
            Values sum to approximately 100. Empty object if no data.
          example:
            food: 40.0
            transport: 33.4
            utilities: 26.6
        spike_category:
          type: string
          nullable: true
          description: >
            Category with a statistically unusual spending day (z-score > 2.0, ddof=1).
            Null if no spike detected or no category has at least 2 distinct days of data.
      example:
        top_category: food
        category_breakdown:
          food: 40.0
          transport: 33.4
          utilities: 26.6
        spike_category: null

    # ── User Profile ─────────────────────────────────────────────────────────
    UpdateProfileRequest:
      type: object
      description: All fields optional. Only supplied fields are updated.
      properties:
        first_name:
          type: string
          nullable: true
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: E.g. "+6281234567890"
      example:
        first_name: "Lewi"
        last_name: "Borosi"
        phone: "+6281234567890"

    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
      example:
        id: 1
        email: "user@example.com"
        name: "Lewi Borosi"
        first_name: "Lewi"
        last_name: "Borosi"
        phone: "+6281234567890"

    # ── Financial Health ──────────────────────────────────────────────────────
    FinancialHealthComponents:
      type: object
      properties:
        savings_rate:
          type: number
          format: float
          description: Current month (income − expense) / income. 0 if no income.
        budget_adherence:
          type: number
          format: float
          description: Fraction of budgets not EXCEEDED (0–1).
        goal_progress:
          type: number
          format: float
          description: Average (current_amount / target_amount) across all goals (0–1).

    FinancialHealthResponse:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Composite score. Formula:
            savings_score = min(savings_rate / 0.20 * 40, 40);
            budget_score = budget_adherence * 30;
            goal_score = goal_progress * 30.
        rating:
          type: string
          enum: [Poor, Fair, Good, Excellent]
          description: "0–40 → Poor, 41–60 → Fair, 61–80 → Good, 81–100 → Excellent"
        components:
          $ref: '#/components/schemas/FinancialHealthComponents'
        trend:
          type: string
          enum: [improving, stable, declining]
          description: Always "stable" in MVP (no historical cache yet).
        last_calculated:
          type: string
          format: date-time
          description: UTC date truncated to day boundary.
      example:
        score: 72
        rating: "Good"
        components:
          savings_rate: 0.21
          budget_adherence: 0.85
          goal_progress: 0.45
        trend: "stable"
        last_calculated: "2026-05-25T00:00:00Z"

    # ── Insights ──────────────────────────────────────────────────────────────
    InsightItem:
      type: object
      properties:
        type:
          type: string
          description: >
            Machine-readable type.
            Values: goal_progress, budget_exceeded, budget_warning,
            income_increase, income_decrease, no_data.
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [success, warning, info]

    InsightsResponse:
      type: object
      properties:
        insights:
          type: array
          items:
            $ref: '#/components/schemas/InsightItem'
        period:
          type: object
          properties:
            month: { type: integer }
            year: { type: integer }
        generated_at:
          type: string
          format: date-time
      example:
        insights:
          - type: "goal_progress"
            title: "3 of 4 goals on track"
            description: "Goals with at least 50% progress toward target amount."
            status: "success"
          - type: "budget_exceeded"
            title: "FOOD budget exceeded"
            description: "You spent 23% over your FOOD budget this month."
            status: "warning"
        period: { month: 5, year: 2026 }
        generated_at: "2026-05-25T10:00:00Z"

    # ── Recommendations ───────────────────────────────────────────────────────
    RecommendationItem:
      type: object
      properties:
        priority:
          type: string
          enum: [high, medium, low]
        category:
          type: string
          description: "E.g. savings, budget, goals, general"
        title:
          type: string
        action:
          type: string
          description: Specific, actionable instruction with real numbers.
        potential_impact:
          type: string
          description: Estimated financial benefit. Empty string when not calculable.

    RecommendationsResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        generated_at:
          type: string
          format: date-time
      example:
        recommendations:
          - priority: "high"
            category: "savings"
            title: "Increase savings rate"
            action: "Your current savings rate is 8%. Increasing to 20% would save an additional Rp 600.000/month."
            potential_impact: "Rp 600.000/month"
        generated_at: "2026-05-25T10:00:00Z"

    # ── Year-based Report Types ───────────────────────────────────────────────
    IncomeExpenseTrendPoint:
      type: object
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        month_name: { type: string, description: "E.g. January" }
        income: { type: number, format: float }
        expense: { type: number, format: float }
        savings: { type: number, format: float, description: income − expense }

    IncomeExpenseTrendResponse:
      type: object
      properties:
        year: { type: integer }
        data:
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/IncomeExpenseTrendPoint'
          description: Always 12 entries (one per month). Months with no data have 0 values.
      example:
        year: 2026
        data:
          - month: 1
            month_name: "January"
            income: 5000000
            expense: 3200000
            savings: 1800000
          - month: 2
            month_name: "February"
            income: 0
            expense: 0
            savings: 0

    NetWorthHistoryPoint:
      type: object
      properties:
        month: { type: integer }
        month_name: { type: string }
        net_worth: { type: number, format: float, description: Cumulative income − expense up to this month }

    NetWorthHistoryResponse:
      type: object
      properties:
        year: { type: integer }
        data:
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/NetWorthHistoryPoint'
      example:
        year: 2026
        data:
          - { month: 1, month_name: "January", net_worth: 1800000 }
          - { month: 2, month_name: "February", net_worth: 4100000 }

    SavingsRateHistoryPoint:
      type: object
      properties:
        month: { type: integer }
        month_name: { type: string }
        income: { type: number, format: float }
        expense: { type: number, format: float }
        rate: { type: number, format: float, description: "(income − expense) / income * 100. 0 when income is 0." }

    SavingsRateHistoryResponse:
      type: object
      properties:
        year: { type: integer }
        data:
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/SavingsRateHistoryPoint'
      example:
        year: 2026
        data:
          - { month: 1, month_name: "January", income: 5000000, expense: 3200000, rate: 36.0 }

    MonthComparisonPeriod:
      type: object
      properties:
        month: { type: integer }
        year: { type: integer }
        income: { type: number, format: float }
        expense: { type: number, format: float }
        savings: { type: number, format: float }

    MonthComparisonV2Response:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/MonthComparisonPeriod'
        previous:
          $ref: '#/components/schemas/MonthComparisonPeriod'
        changes:
          type: object
          properties:
            income_pct: { type: number, format: float, description: "% change vs previous month. 0 if previous income = 0." }
            expense_pct: { type: number, format: float }
            savings_pct: { type: number, format: float }
      example:
        current: { month: 5, year: 2026, income: 5420000, expense: 3240000, savings: 2180000 }
        previous: { month: 4, year: 2026, income: 5300000, expense: 3500000, savings: 1800000 }
        changes: { income_pct: 2.3, expense_pct: -7.4, savings_pct: 21.1 }

    CategoryBreakdownItem:
      type: object
      properties:
        category: { type: string, description: "Raw category value from transaction (e.g. FOOD)" }
        label: { type: string, description: "Human-readable label (e.g. Food & Dining)" }
        total: { type: number, format: float }
        percentage: { type: number, format: float, description: "Rounded to 1 decimal. Values across items sum to ~100." }
        transaction_count: { type: integer }

    CategoryBreakdownResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            month: { type: integer }
            year: { type: integer }
        total_expense:
          type: number
          format: float
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdownItem'
          description: Sorted by total descending.
      example:
        period: { month: 5, year: 2026 }
        total_expense: 3240000
        data:
          - category: "FOOD"
            label: "Food & Dining"
            total: 1200000
            percentage: 37.0
            transaction_count: 15
          - category: "TRANSPORT"
            label: "Transportation"
            total: 450000
            percentage: 13.9
            transaction_count: 8

    # ── Notification Preferences (extended) ───────────────────────────────────
    NotificationPreferencesBody:
      type: object
      properties:
        budget_alerts:
          type: boolean
          default: true
        goal_reminders:
          type: boolean
          default: true
        anomaly_alerts:
          type: boolean
          default: true
        weekly_summary:
          type: boolean
          default: false
          description: Receive a weekly financial summary (future cron job)
        push_enabled:
          type: boolean
          default: false
          description: Enable push notifications (future FCM integration)
      example:
        budget_alerts: true
        goal_reminders: true
        anomaly_alerts: true
        weekly_summary: false
        push_enabled: false

paths:
  # ── Auth ────────────────────────────────────────────────────────────────────
  /api/v1/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      description: >
        On success the JWT is returned in the response body **and** set as an
        `accessToken` cookie (1-hour expiry). Subsequent requests may use
        either the cookie or an `Authorization: Bearer <token>` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users:
    get:
      tags: [Auth]
      summary: List all users (no auth required)
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  status:
                    type: string
                  message:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Transactions ─────────────────────────────────────────────────────────────
  /api/auth/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions (paginated, filterable)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Filter by month number (1–12)"
        - name: year
          in: query
          schema:
            type: string
          description: "Filter by 4-digit year"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Page size (0 = no limit)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of records to skip
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Transactions]
      summary: Create a transaction
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/transactions/monthly:
    get:
      tags: [Transactions]
      summary: Current month total expenses
      description: Returns the sum of all EXPENSE transactions for the current calendar month.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Monthly expense total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTotalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/transactions/monthly-income:
    get:
      tags: [Transactions]
      summary: Current month total income
      description: Returns the sum of all INCOME transactions for the current calendar month.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Monthly income total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTotalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/transactions/{id}:
    put:
      tags: [Transactions]
      summary: Update a transaction
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid input or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Transactions]
      summary: Soft-delete a transaction
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Budgets ───────────────────────────────────────────────────────────────────
  /api/auth/v1/budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      description: >
        Response fields use **snake_case** (`user_id`, `limit_amount`,
        `alert_threshold`, `created_at`). See `BudgetListItem` schema.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: month
          in: query
          schema:
            type: string
          description: >
            Ignored. MONTHLY budgets recur (no stored month) and YEARLY
            budgets never had one — kept for backward compatibility only.
        - name: year
          in: query
          schema:
            type: string
          description: >
            Filter by 4-digit year. Only scopes YEARLY budgets; MONTHLY
            budgets recur every year and are always returned regardless
            of this filter.
      responses:
        '200':
          description: Budget list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BudgetListItem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Budgets]
      summary: Create a budget
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Budget for this category/period/month/year already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/budgets/usage:
    get:
      tags: [Budgets]
      summary: Budget usage with SAFE / WARNING / EXCEEDED status
      description: >
        Compares current-period spending against limit_amount and
        alert_threshold. Returns a **direct JSON array** (not wrapped in
        `{"data": ...}`).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
          description: 4-digit year (e.g. 2025)
        - name: month
          in: query
          schema:
            type: integer
          description: 1–12. Defaults to current month when omitted.
      responses:
        '200':
          description: Budget usage array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetUsageResponse'
        '400':
          description: Invalid or missing year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/budgets/{id}:
    get:
      tags: [Budgets]
      summary: Get budget by ID
      description: >
        Response fields use **camelCase** (`userId`, `limitAmount`,
        `alertThreshold`, `createdAt`). See `BudgetResponse` schema.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Budget detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BudgetResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Budgets]
      summary: Update a budget
      description: >
        Partial update — omitted fields keep their existing values.
        Zero values for `limitAmount` / `alertThreshold` are treated as
        "no change" (see `NULLIF` in repo). Response uses **snake_case**
        and does not include `created_at`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
      responses:
        '200':
          description: Budget updated — returns updated record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UpdateBudgetResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Budgets]
      summary: Soft-delete a budget
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Budget deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Goals ──────────────────────────────────────────────────────────────────────
  /api/auth/v1/goals:
    get:
      tags: [Goals]
      summary: List goals
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
            default: false
          description: >
            Pass `true` to return only goals whose deadline >= now.
            Server compares the string value "true" literally.
      responses:
        '200':
          description: Goal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GoalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Goals]
      summary: Create a goal
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error (deadline in past, target ≤ 0, name empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Active goal with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/overview:
    get:
      tags: [Goals]
      summary: Goal overview — active count, total savings, upcoming milestones
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Goal overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/GoalOverviewResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/milestones:
    get:
      tags: [Goals]
      summary: Next 4 upcoming milestones (deadline ascending, not yet completed)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Milestone list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 4
                    items:
                      $ref: '#/components/schemas/GoalResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/contribute:
    patch:
      tags: [Goals]
      summary: Set a goal's current_amount
      description: >
        **Sets** `current_amount` to the supplied `contribution` value — it does
        not add to the existing amount. Auto-completes the goal when
        `contribution >= target_amount`. Contribution must not exceed
        all-time net savings.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalContributionRequest'
      responses:
        '200':
          description: Contribution applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid input or contribution exceeds net savings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/v1/goals/{id}:
    get:
      tags: [Goals]
      summary: Get goal by ID
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Goal detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Goals]
      summary: Update a goal
      description: >
        If new `target_amount` is less than `current_amount`, the target
        is NOT updated (prevents setting a target below what was already saved).
        Deadline is updated unconditionally.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Goals]
      summary: Hard-delete a goal
      description: >
        Unlike transactions and budgets, goals are permanently deleted
        (no soft-delete / `deleted_at`).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Goal deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /api/auth/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregated financial dashboard
      description: >
        Returns current-month income, expense, all-time net savings, budget
        status counts, goal progress counts, and list of active goals.
        No query parameters — always uses server-side `time.Now()`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Chat ──────────────────────────────────────────────────────────────────────
  /api/auth/v1/chat:
    post:
      tags: [Chat]
      summary: Ask the AI assistant about your finances
      description: >
        Sends a natural-language question to Gemini 2.0 Flash with the user's
        current financial context (monthly income/expense, budget status, active
        goals). The conversation is persisted to `ai_logs`. Responds in the
        same language the user writes in. Requires `GEMINI_API_KEY` to be set
        on the server — returns 503 otherwise.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: AI reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Missing or empty message field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Gemini API key not configured or Gemini unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
